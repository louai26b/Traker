const EMPTY={profile:null,subjects:[],lessons:[],tasks:[],exams:[],dayOffset:0,selExam:null};
function useStore(){
  const [d,setD]=useState(()=>{try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return EMPTY});
  useEffect(()=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}},[d]);

}

const card="rounded-xl border border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900";

/* ---------- Onboarding wizard ---------- */
function Wizard({d,onDone,onClose}){
  const pr=d.profile;
  const [step,setStep]=useState(1),[track,setTrack]=useState(pr?pr.track:""),[custom,setCustom]=useState(pr?pr.custom||"":""),[year,setYear]=useState(pr?pr.year:"");
  const [mods,setMods]=useState(pr?d.subjects:[]),[modKey,setModKey]=useState(pr?pr.track+"-"+pr.year+(pr.track==="custom"?pr.custom:""):"");
  const key=track+"-"+year+(track==="custom"?custom.trim():"");
  const ok1=track&&(track!=="custom"||custom.trim());
  const go=n=>{if(n===3&&key!==modKey){setMods(suggest(track,year));setModKey(key)}setStep(n)};
  const setM=(id,p)=>setMods(m=>m.map(x=>x.id===id?{...x,...p}:x));
  const valid=mods.filter(m=>m.name.trim());
  const chip=on=>"rounded-lg border px-3 py-2 text-sm text-start "+(on?"border-indigo-500 bg-indigo-500/10 text-indigo-700 dark:text-indigo-300":"border-zinc-200 dark:border-zinc-700 hover:bg-zinc-100 dark:hover:bg-zinc-800");
  return <div className="fixed inset-0 z-50 bg-black/40 flex items-center justify-center p-4">
    <div className={card+" w-full max-w-lg max-h-[90vh] overflow-auto p-5 shadow-xl"}>
      <div className="flex items-start justify-between mb-4"><h2 className="text-lg font-semibold">{t("wTitle")}</h2>
        {onClose&&<button className={icon} onClick={onClose} aria-label={t("cancel")}><I n="x"/></button>}</div>
      <div className="flex gap-2 mb-5">{[1,2,3].map(n=><div key={n} className="flex-1"><div className={"h-1 rounded-full "+(n<=step?"bg-indigo-600":"bg-zinc-200 dark:bg-zinc-800")}/><p className={"text-xs mt-1 "+(n===step?"font-medium":"text-zinc-500")}>{n}. {t("w"+n)}</p></div>)}</div>
      {step===1&&<div className="space-y-3">
        <div className="grid grid-cols-2 gap-2">{TRACKS.map(k=><button key={k} className={chip(track===k)} onClick={()=>setTrack(k)}>{t("tr_"+k)}</button>)}</div>
        <input className={inp+" w-full"} placeholder={t("wCustom")} value={custom} onChange={e=>{setCustom(e.target.value);setTrack("custom")}}/></div>}
      {step===2&&<div className="grid grid-cols-3 gap-2">{YEARS.map(y=><button key={y} className={chip(year===y)} onClick={()=>setYear(y)}>{yearName(y)}</button>)}</div>}
      {step===3&&<div className="space-y-2">
        <p className="text-sm text-zinc-500">{mods.length?t("wHint"):t("wNone")}</p>
        {mods.map(m=><div key={m.id} className="flex items-center gap-2">
          <button aria-label="color" className="w-5 h-5 rounded-full shrink-0" style={{background:m.color}} onClick={()=>setM(m.id,{color:COLORS[(COLORS.indexOf(m.color)+1)%COLORS.length]})}/>
          <input className={inp+" flex-1"} value={m.name} placeholder={t("moduleName")} onChange={e=>setM(m.id,{name:e.target.value})}/>
          <button className={icon} aria-label={t("del")} onClick={()=>setMods(x=>x.filter(y=>y.id!==m.id))}><I n="trash"/></button></div>)}
        <button className={ghost} onClick={()=>setMods(m=>[...m,{id:uid(),name:"",color:COLORS[m.length%COLORS.length]}])}><I n="plus"/>{t("newModule")}</button></div>}
      <div className="flex justify-between mt-6">
        <button className={ghost} disabled={step===1} onClick={()=>go(step-1)}>{t("back")}</button>
        {step<3?<button className={primary} disabled={step===1?!ok1:!year} onClick={()=>go(step+1)}>{t("next")}</button>
        :<button className={primary} disabled={!valid.length} onClick={()=>onDone({track,custom:custom.trim(),year},valid.map(m=>({...m,name:m.name.trim()})))}>{t("finish")}</button>}
      </div>
    </div></div>;
}

/* ---------- Countdown ---------- */
function Countdown({exams,sel,setSel,now,onAdd,onDel}){
  const [adding,setAdding]=useState(false),[title,setTitle]=useState(""),[when,setWhen]=useState("");
  const sorted=[...exams].sort((a,b)=>new Date(a.date)-new Date(b.date));
  const nearest=sorted.find(e=>new Date(e.date)>now)||sorted[0];
  const cur=sorted.find(e=>e.id===sel)||nearest;
  const ms=cur?Math.max(0,new Date(cur.date)-now):0;
  const parts=[["days",Math.floor(ms/864e5)],["hours",Math.floor(ms/36e5)%24],["minutes",Math.floor(ms/6e4)%60]];
  const add=()=>{if(!title.trim()||!when)return;onAdd({id:uid(),title:title.trim(),date:when});setTitle("");setWhen("");setAdding(false)};
  return <section className={card+" p-4 sm:p-5"}>
    <div className="flex flex-wrap items-start justify-between gap-3">
      <div><p className="text-sm text-zinc-500">{cur&&nearest&&cur.id===nearest.id?t("nextUp"):t("countdown")}</p>
        <h2 className="text-xl sm:text-2xl font-semibold tracking-tight">{cur?cur.title:t("noExams")}</h2>
        {cur&&<p className="text-sm text-zinc-500">{new Date(cur.date).toLocaleString(LOC,{dateStyle:"full",timeStyle:"short"})}</p>}</div>
      <div className="flex gap-2">
        {cur&&<button className={ghost} onClick={()=>onDel(cur.id)} aria-label={t("del")}><I n="trash"/></button>}
        <button className={ghost} onClick={()=>setAdding(!adding)}><I n={adding?"x":"plus"}/>{t("addExam")}</button></div>
    </div>
    {cur&&<div className="mt-4 grid grid-cols-3 gap-2 sm:gap-3">{parts.map(([l,v])=><div key={l} className="rounded-lg bg-zinc-50 dark:bg-zinc-800/60 py-3 text-center">
      <div className="text-3xl sm:text-4xl font-semibold tabular-nums">{p2(v)}</div><div className="text-xs text-zinc-500 mt-0.5">{t(l)}</div></div>)}</div>}
    {cur&&ms===0&&<p className="mt-2 text-sm text-zinc-500">{t("passed")}</p>}
    {adding&&<div className="mt-4 flex flex-wrap gap-2">
      <input className={inp+" flex-1 basis-48"} placeholder={t("examTitle")} value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <input type="datetime-local" className={inp} value={when} onChange={e=>setWhen(e.target.value)}/>
      <button className={primary} onClick={add}>{t("saveExam")}</button></div>}
    {sorted.length>1&&<div className="mt-4 flex gap-2 overflow-x-auto pb-1">{sorted.map(e=><button key={e.id} onClick={()=>setSel(e.id)} className={"shrink-0 rounded-full border px-3 py-1 text-xs "+(cur&&cur.id===e.id?"border-indigo-500 bg-indigo-500/10 text-indigo-600 dark:text-indigo-300":"border-zinc-200 dark:border-zinc-700 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800")}>
      {e.title} · {new Date(e.date)>now?Math.ceil((new Date(e.date)-now)/864e5)+" "+t("days"):"✓"}</button>)}</div>}
  </section>;
}

/* ---------- Progress ---------- */
function Bar({name,done,total,color,remain}){
  const pct=total?Math.round(done/total*100):0;
  return <div><div className="flex justify-between gap-2 text-xs mb-1"><span className="font-medium">{name} <span className="text-zinc-500 font-normal">{done}/{total} · {pct}%</span></span><span className="text-zinc-500">{total-done} {remain}</span></div>
    <div className="h-2 rounded-full bg-zinc-100 dark:bg-zinc-800 overflow-hidden"><div className="bar h-full rounded-full" style={{width:pct+"%",background:color}}/></div></div>;
}
function Stats({ls,med}){
  const n=ls.length,c=k=>ls.filter(l=>l[k]).length;
  return <div className="space-y-2.5">
    <Bar name={t("studied")} done={c("studied")} total={n} color="#6366f1" remain={t("leftStudy")}/>
    <Bar name={t("revised")} done={c("revised")} total={n} color="#10b981" remain={t("unrevised")}/>
    <Bar name={t(med?"exMed":"exercises")} done={c("exercises")} total={n} color="#f59e0b" remain={t("unsolved")}/></div>;
}
function Toggle({on,text,onClick}){
  return <button onClick={onClick} aria-pressed={!!on} className={"inline-flex items-center gap-1 rounded-full border px-2.5 py-1 text-xs "+(on?"border-emerald-500/40 bg-emerald-500/10 text-emerald-700 dark:text-emerald-300":"border-zinc-200 dark:border-zinc-700 text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800")}><I n={on?"check":"plus"} c="w-3 h-3"/>{text}</button>;
}
function Subject({s,lessons,filter,upd,med}){
  const [edit,setEdit]=useState(false),[name,setName]=useState(s.name),[color,setColor]=useState(s.color),[nl,setNl]=useState("");
  const all=lessons.filter(l=>l.subjectId===s.id);
  const F={all:()=>true,ns:l=>!l.studied,rev:l=>!l.revised,ex:l=>!l.exercises}[filter];
  const shown=all.filter(F);
  const setL=(id,k)=>upd(d=>({lessons:d.lessons.map(l=>l.id===id?{...l,[k]:l[k]?0:1}:l)}));
  const addL=()=>{if(!nl.trim())return;upd(d=>({lessons:[...d.lessons,{id:uid(),subjectId:s.id,title:nl.trim(),studied:0,revised:0,exercises:0}]}));setNl("")};
  const save=()=>{if(!name.trim())return;upd(d=>({subjects:d.subjects.map(x=>x.id===s.id?{...x,name:name.trim(),color}:x)}));setEdit(false)};
  const del=()=>upd(d=>({subjects:d.subjects.filter(x=>x.id!==s.id),lessons:d.lessons.filter(l=>l.subjectId!==s.id),tasks:d.tasks.map(x=>x.subjectId===s.id?{...x,subjectId:""}:x)}));
  return <div className={card+" p-4"} style={{borderTop:`3px solid ${s.color}`}}>
    {edit?<div className="flex flex-wrap items-center gap-2 mb-3">
      <input className={inp+" flex-1 basis-40"} value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&save()}/>
      <Swatches v={color} set={setColor}/><button className={primary} onClick={save}>{t("save")}</button>
      <button className={ghost} onClick={()=>{setEdit(false);setName(s.name);setColor(s.color)}}>{t("cancel")}</button></div>
    :<div className="flex items-center justify-between mb-3">
      <h3 className="font-semibold flex items-center gap-2"><span className="w-2.5 h-2.5 rounded-full" style={{background:s.color}}/>{s.name}<span className="text-xs font-normal text-zinc-500">{tf("lessonsN",{n:all.length})}</span></h3>
      <div className="flex"><button className={icon} onClick={()=>setEdit(true)} aria-label={t("save")}><I n="pencil"/></button><button className={icon} onClick={del} aria-label={t("del")}><I n="trash"/></button></div></div>}
    {all.length>0&&<div className="mb-3"><Stats ls={all} med={med}/></div>}
    <ul className="divide-y divide-zinc-100 dark:divide-zinc-800">{shown.map(l=><li key={l.id} className="py-2 flex flex-wrap items-center gap-x-3 gap-y-1.5">
      <span className={"flex-1 basis-40 text-sm "+(l.studied&&l.revised&&l.exercises?"text-zinc-400 line-through":"")}>{l.title}</span>
      <div className="flex flex-wrap gap-1.5">
        <Toggle on={l.studied} text={t("studied")} onClick={()=>setL(l.id,"studied")}/>
        <Toggle on={l.revised} text={t("revised")} onClick={()=>setL(l.id,"revised")}/>
        <Toggle on={l.exercises} text={t(med?"exMed":"exercises")} onClick={()=>setL(l.id,"exercises")}/>
        <button className={icon+" !p-1"} aria-label={t("del")} onClick={()=>upd(d=>({lessons:d.lessons.filter(x=>x.id!==l.id)}))}><I n="x"/></button></div></li>)}</ul>
    {!shown.length&&<p className="text-sm text-zinc-500 py-2">{all.length?t("noMatch"):t("noLessons")}</p>}
    <div className="mt-3 flex gap-2"><input className={inp+" flex-1"} placeholder={t("addLesson")} value={nl} onChange={e=>setNl(e.target.value)} onKeyDown={e=>e.key==="Enter"&&addL()}/>
      <button className={ghost} onClick={addL}><I n="plus"/>{t("add")}</button></div>
  </div>;
}
function Progress({d,upd}){
  const [filter,setFilter]=useState("all"),[adding,setAdding]=useState(false),[name,setName]=useState(""),[color,setColor]=useState(COLORS[3]);
  const med=d.profile&&d.profile.track==="med",n=d.lessons.length;
  const add=()=>{if(!name.trim())return;upd(x=>({subjects:[...x.subjects,{id:uid(),name:name.trim(),color}]}));setName("");setAdding(false)};
  return <div className="space-y-4">
    <div className={card+" p-4 sm:p-5"}><div className="flex flex-wrap items-baseline justify-between gap-1 mb-3"><h2 className="font-semibold">{t("overall")}</h2>
      <span className="text-sm text-zinc-500">{tf("lessonsN",{n})} · {tf("remStudy",{n:n-d.lessons.filter(l=>l.studied).length})}</span></div><Stats ls={d.lessons} med={med}/></div>
    <div className="flex flex-wrap items-center justify-between gap-2">
      <div className="flex gap-1.5 overflow-x-auto">{[["all","f_all"],["ns","f_ns"],["rev","f_rev"],["ex","f_ex"]].map(([k,l])=><button key={k} onClick={()=>setFilter(k)} className={"shrink-0 rounded-full px-3 py-1 text-sm "+(filter===k?"bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900":"text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800")}>{t(l)}</button>)}</div>
      <button className={ghost} onClick={()=>setAdding(!adding)}><I n={adding?"x":"plus"}/>{t("newModule")}</button></div>
    {adding&&<div className={card+" p-3 flex flex-wrap items-center gap-2"}>
      <input autoFocus className={inp+" flex-1 basis-40"} placeholder={t("moduleName")} value={name} onChange={e=>setName(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <Swatches v={color} set={setColor}/><button className={primary} onClick={add}>{t("create")}</button></div>}
    {!d.subjects.length&&<p className={card+" p-6 text-center text-sm text-zinc-500"}>{t("noModules")}</p>}
    <div className="grid gap-4 lg:grid-cols-2">{d.subjects.map(s=><Subject key={s.id} s={s} lessons={d.lessons} filter={filter} upd={upd} med={med}/>)}</div>
  </div>;
}

/* ---------- Tasks ---------- */
function Row({t:k,subj,missed,upd,today}){
  const set=p=>upd(d=>({tasks:d.tasks.map(x=>x.id===k.id?{...x,...p}:x)}));
  const del=()=>upd(d=>({tasks:d.tasks.filter(x=>x.id!==k.id)}));
  return <li className="py-2.5 flex flex-wrap items-center gap-x-3 gap-y-2">
    <button onClick={()=>set({done:!k.done})} aria-label={t("markDone")} className={"w-5 h-5 shrink-0 rounded-md border flex items-center justify-center "+(k.done?"bg-indigo-600 border-indigo-600 text-white":"border-zinc-300 dark:border-zinc-600 hover:border-indigo-500")}>{k.done&&<I n="check" c="w-3.5 h-3.5"/>}</button>
    <div className="flex-1 basis-40 min-w-0"><p className={"text-sm "+(k.done?"line-through text-zinc-400":"")}>{k.title}</p>
      <p className="text-xs text-zinc-500 flex flex-wrap items-center gap-x-2">
        {missed&&<span>{t("wasDue")} {label(k.date)}{k.time?" · "+k.time:""}</span>}
        {!missed&&k.time&&<span className="inline-flex items-center gap-1"><I n="clock" c="w-3 h-3"/>{k.time}</span>}
        {subj&&<span className="inline-flex items-center gap-1"><span className="w-2 h-2 rounded-full" style={{background:subj.color}}/>{subj.name}</span>}</p></div>
    {missed?<div className="flex flex-wrap gap-1.5">
      <button className={ghost+" !py-1 text-xs"} onClick={()=>set({date:today,time:""})}>{t("move")}</button>
      <button className={ghost+" !py-1 text-xs"} onClick={()=>set({done:true})}>{t("markDone")}</button>
      <button className={ghost+" !py-1 text-xs text-red-600 dark:text-red-400"} onClick={del}>{t("del")}</button></div>
    :<button className={icon} onClick={del} aria-label={t("del")}><I n="trash"/></button>}
  </li>;
}
function Tasks({d,upd,today,nowHM}){
  const [title,setTitle]=useState(""),[date,setDate]=useState(""),[time,setTime]=useState(""),[sid,setSid]=useState("");
  const missed=k=>!k.done&&(k.date<today||(k.date===today&&k.time&&k.time<nowHM));
  const subj=id=>d.subjects.find(s=>s.id===id);
  const sort=(a,b)=>(a.date+a.time).localeCompare(b.date+b.time);
  const M=d.tasks.filter(missed).sort(sort),T=d.tasks.filter(k=>k.date===today&&!missed(k)).sort(sort);
  const U=d.tasks.filter(k=>k.date>today).sort(sort),E=d.tasks.filter(k=>k.date<today&&k.done).sort(sort);
  const add=()=>{if(!title.trim())return;upd(x=>({tasks:[...x.tasks,{id:uid(),title:title.trim(),date:date||today,time,subjectId:sid,done:false}]}));setTitle("");setTime("")};
  const Sec=({name,list,empty})=><div className={card+" p-4"}><h3 className="font-semibold mb-1">{name} <span className="text-sm font-normal text-zinc-500">{list.length}</span></h3>
    {list.length?<ul className="divide-y divide-zinc-100 dark:divide-zinc-800">{list.map(k=><Row key={k.id} t={k} subj={subj(k.subjectId)} upd={upd} today={today}/>)}</ul>:<p className="text-sm text-zinc-500 py-2">{empty}</p>}</div>;
  return <div className="space-y-4">
    {M.length>0&&<div className="rounded-xl border border-red-300 dark:border-red-500/40 bg-red-50 dark:bg-red-950/30 p-4">
      <h3 className="font-semibold text-red-700 dark:text-red-300 flex items-center gap-2"><I n="alert" c="w-5 h-5"/>{t("missedTitle")} <span className="text-sm font-normal">({M.length})</span></h3>
      <p className="text-sm text-red-700/80 dark:text-red-300/80 mb-1">{t("missedSub")}</p>
      <ul className="divide-y divide-red-200 dark:divide-red-500/20">{M.map(k=><Row key={k.id} t={k} missed subj={subj(k.subjectId)} upd={upd} today={today}/>)}</ul></div>}
    <div className={card+" p-3 flex flex-wrap items-center gap-2"}>
      <input className={inp+" flex-1 basis-48"} placeholder={t("addTask")} value={title} onChange={e=>setTitle(e.target.value)} onKeyDown={e=>e.key==="Enter"&&add()}/>
      <input type="date" className={inp} value={date||today} onChange={e=>setDate(e.target.value)}/>
      <input type="time" className={inp} value={time} onChange={e=>setTime(e.target.value)}/>
      <select className={inp+" dark:bg-zinc-900"} value={sid} onChange={e=>setSid(e.target.value)}><option value="">{t("noSubject")}</option>{d.subjects.map(s=><option key={s.id} value={s.id}>{s.name}</option>)}</select>
      <button className={primary} onClick={add}><I n="plus"/>{t("add")}</button></div>
    <div className="grid gap-4 lg:grid-cols-2"><Sec name={t("todayName")+" · "+label(today)} list={T} empty={t("noToday")}/><Sec name={t("upcoming")} list={U} empty={t("noUpcoming")}/></div>
    {E.length>0&&<Sec name={t("doneEarlier")} list={E} empty=""/>}
  </div>;
}

/* ---------- App ---------- */
function App(){
  const [d,setD]=useStore();
  const [tab,setTab]=useState("progress"),[confirm,setConfirm]=useState(false),[menu,setMenu]=useState(false),[wiz,setWiz]=useState(false);
  const [now,setNow]=useState(new Date());
  const [lang,setLang]=useState(()=>{try{const v=localStorage.getItem("study-lang");if(v)return v}catch(e){}const n=(navigator.language||"en").slice(0,2);return n==="ar"||n==="fr"?n:"en"});
  const [dark,setDark]=useState(()=>{try{const v=localStorage.getItem("study-theme");if(v)return v==="dark"}catch(e){}return window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches});
  const L=LANGS.find(l=>l[0]===lang);LI=L[2];LOC=L[3];
  useEffect(()=>{const i=setInterval(()=>setNow(new Date()),1000);return()=>clearInterval(i)},[]);
  useEffect(()=>{const h=document.documentElement;h.lang=lang;h.dir=lang==="ar"?"rtl":"ltr";document.title=t("title");try{localStorage.setItem("study-lang",lang)}catch(e){}},[lang]);
  useEffect(()=>{document.documentElement.classList.toggle("dark",dark);try{localStorage.setItem("study-theme",dark?"dark":"light")}catch(e){}},[dark]);
  const upd=p=>setD(x=>({...x,...(typeof p==="function"?p(x):p)}));
  const today=addDays(fmt(now),d.dayOffset||0),nowHM=`${p2(now.getHours())}:${p2(now.getMinutes())}`;
  const missedN=d.tasks.filter(k=>!k.done&&(k.date<today||(k.date===today&&k.time&&k.time<nowHM))).length;
  const finish=(profile,mods)=>{upd(x=>{const ids=mods.map(m=>m.id);return{profile,subjects:mods,lessons:x.lessons.filter(l=>ids.includes(l.subjectId)),tasks:x.tasks.map(k=>ids.includes(k.subjectId)?k:{...k,subjectId:""})}});setWiz(false)};
  const Tab=({id,text,badge})=><button onClick={()=>setTab(id)} className={"px-3 py-1.5 text-sm rounded-lg "+(tab===id?"bg-zinc-900 text-white dark:bg-zinc-100 dark:text-zinc-900":"text-zinc-500 hover:bg-zinc-100 dark:hover:bg-zinc-800")}>{text}{badge>0&&<span className="ms-1.5 rounded-full bg-red-500 text-white text-xs px-1.5">{badge}</span>}</button>;
  return <div className="max-w-5xl mx-auto px-4 py-5 space-y-4">
    {(!d.profile||wiz)&&<Wizard d={d} onDone={finish} onClose={d.profile?()=>setWiz(false):null}/>}
    <header className="flex flex-wrap items-center justify-between gap-3">
      <div><h1 className="text-lg font-semibold tracking-tight">{t("title")}</h1>
        {d.profile&&<p className="text-sm text-zinc-500">{trackName(d.profile)} · {yearName(d.profile.year)}</p>}</div>
      <div className="flex flex-wrap items-center gap-2 relative">
        <div className="flex rounded-lg border border-zinc-200 dark:border-zinc-700 overflow-hidden">{LANGS.map(l=><button key={l[0]} onClick={()=>setLang(l[0])} className={"px-2.5 py-1.5 text-sm "+(lang===l[0]?"bg-indigo-600 text-white":"hover:bg-zinc-100 dark:hover:bg-zinc-800")}>{l[1]}</button>)}</div>
        <button className={ghost} onClick={()=>upd(x=>({dayOffset:(x.dayOffset||0)+1}))}><I n="ff"/>{t("simulate")}</button>
        {d.dayOffset>0&&<button className={ghost} onClick={()=>upd({dayOffset:0})}>{t("backReal")}</button>}
        <button className={ghost} onClick={()=>setDark(!dark)} aria-label="Theme"><I n={dark?"sun":"moon"}/></button>
        <button className={ghost} onClick={()=>{setMenu(!menu);setConfirm(false)}} aria-label={t("setup")}><I n="gear"/></button>
        {menu&&<div className={card+" absolute end-0 top-11 z-10 w-60 p-2 shadow-lg space-y-1"}>
          <button className={ghost+" w-full"} onClick={()=>{setWiz(true);setMenu(false)}}>{t("setup")}</button>
          <button className={ghost+" w-full text-red-600 dark:text-red-400"} onClick={()=>{if(!confirm){setConfirm(true);return}setD(EMPTY);setConfirm(false);setMenu(false)}}>{confirm?t("confirm"):t("clear")}</button></div>}
      </div>
    </header>
    {d.dayOffset>0&&<p className="text-xs rounded-lg bg-amber-500/10 text-amber-700 dark:text-amber-300 px-3 py-2">{tf("simBanner",{n:d.dayOffset,d:label(today)})}</p>}
    <Countdown exams={d.exams} sel={d.selExam} setSel={id=>upd({selExam:id})} now={now} onAdd={e=>upd(x=>({exams:[...x.exams,e],selExam:e.id}))} onDel={id=>upd(x=>({exams:x.exams.filter(e=>e.id!==id),selExam:null}))}/>
    <nav className="flex gap-1.5"><Tab id="progress" text={t("tabCourses")}/><Tab id="tasks" text={t("tabTasks")} badge={missedN}/></nav>
    {tab==="progress"?<Progress d={d} upd={upd}/>:<Tasks d={d} upd={upd} today={today} nowHM={nowHM}/>}
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
